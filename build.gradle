plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = 'fr.citizen.mancie'

base {
    archivesName = 'citizenmancie'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Version imposée : NeoForge 21.1.215 (Minecraft 1.21.1)
    version = '21.1.215'

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        citizenmancie {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
